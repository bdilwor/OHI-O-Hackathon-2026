# One command: `docker compose up -d --build`
#   db      PostGIS
#   loader  loads data/ into Postgres and publishes asset_risk (skips both when already done), then exits
#   api     FastAPI on http://localhost:8000 (docs at /docs), starts after loader succeeds
#   web     React frontend on http://localhost:5173 (Vite dev server; proxies /api to the api service)
#   ml      on demand only: `docker compose run --rm ml` (retrain) / `... ml pytest -q tests` (tests)
#   research  on demand only: `docker compose --profile research run --rm research` (FNO feasibility test)

x-backend: &backend
  build: ./backend
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-outage}:${POSTGRES_PASSWORD:-outage}@db:5432/${POSTGRES_DB:-outage}
    DATA_DIR: /data
    LLM_PROVIDER: ${LLM_PROVIDER:-groq}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outage}
      POSTGRES_DB: ${POSTGRES_DB:-outage}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  loader:
    <<: *backend
    environment:
      <<: *backend-env
      FORCE_RELOAD: ${FORCE_RELOAD:-0}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m db.load_all && python -m ml.score_assets --if-missing"

  api:
    <<: *backend
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app  # live code reload during development
    depends_on:
      loader:
        condition: service_completed_successfully
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 3  # SSE streams never close on their own

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_TARGET: http://api:8000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules  # container's own Linux node_modules (not the host's)
    depends_on:
      - api
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"

  ml:
    <<: *backend
    profiles: ["ml"]
    volumes:
      - ./backend:/app  # artifacts are written back to backend/ml/artifacts
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m ml.build_dataset && python -m ml.train && python -m ml.duration && python -m ml.score_assets"

  research:  # neural-operator feasibility test only (torch + neuraloperator); not part of the app
    build:
      context: ./backend/research
      dockerfile: Dockerfile.research
    profiles: ["research"]
    volumes:
      - ./backend:/app

volumes:
  pgdata:
  web_node_modules:

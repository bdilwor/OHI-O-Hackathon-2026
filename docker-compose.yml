services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outage}
      POSTGRES_DB: ${POSTGRES_DB:-outage}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  loader:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-outage}:${POSTGRES_PASSWORD:-outage}@db:5432/${POSTGRES_DB:-outage}
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  # Train + score: docker compose run --rm ml
  ml:
    build: ./backend
    profiles: ["ml"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-outage}:${POSTGRES_PASSWORD:-outage}@db:5432/${POSTGRES_DB:-outage}
    volumes:
      - ./backend:/app  # artifacts written back to backend/ml/artifacts
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m ml.build_dataset && python -m ml.train && python -m ml.duration && python -m ml.score_assets"

volumes:
  pgdata:

[pytest]
testpaths = tests
# The backend is bind-mounted from the host; don't write .pytest_cache into the repo.
addopts = -p no:cacheprovider
filterwarnings =
    # Third-party deprecation notices (starlette TestClient, matplotlib's pyparsing use): not ours to fix.
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:matplotlib.*
    ignore:.*deprecated - use.*
    # SQLAlchemy reflection doesn't know the PostGIS `geometry` type; column names are all we inspect.
    ignore:Did not recognize type 'geometry'
